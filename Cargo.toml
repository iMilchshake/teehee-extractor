[package]
name = "teehee_extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "teehee_extractor"
path = "src/main.rs"

[lib]
name = "teehee_extractor"
path = "src/lib.rs"

[dependencies]
teehistorian-replayer = "0.10.0"
twgame = "0.10.0"
twmap = "0.12.4"
hdf5 = { package = "hdf5-metno", version = "0.12.1" }
ndarray = "0.15"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
sha2 = "0.10"
derivative = "2.2"
rayon = "1.10"
mimalloc = { version = "0.1", default-features = false }
arrow = { version = "54", default-features = false, features = ["ipc"] }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd", "snap"] }
