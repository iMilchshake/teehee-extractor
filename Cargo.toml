[package]
name = "teehee_extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "teehee_extractor"
path = "src/main.rs"

[lib]
name = "teehee_extractor"
path = "src/lib.rs"

[dependencies]
teehistorian-replayer = "0.10.0"
twgame = "0.10.0"
twmap = "0.12.4"
hdf5 = { package = "hdf5-metno", version = "0.9.2" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
